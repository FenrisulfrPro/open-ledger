name: Build Android APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies & sync web assets
        run: |
          npm ci
          npx cap sync android

      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          sed -i "s/versionName \"[^\"]*\"/versionName \"${VERSION}\"/" android/app/build.gradle
          CODE=$(echo "${GITHUB_REF_NAME#v}" | grep -oE '[0-9]+' | head -1)
          sed -i "s/versionCode [0-9]*/versionCode ${CODE:-1}/" android/app/build.gradle
          echo "versionName=${VERSION} versionCode=${CODE:-1}"

      - name: Decode signing keystore
        id: keystore
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KS_B64" ]; then
            echo "missing=1" >> "$GITHUB_OUTPUT"
            echo "::warning::未配置签名密钥 Secrets，将产出 debug 签名 APK（仅供测试安装，不可覆盖升级）"
          else
            echo "$KS_B64" | base64 -d > "$GITHUB_WORKSPACE/open-ledger.keystore"
            echo "missing=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Build signed release APK
        if: steps.keystore.outputs.missing == '0'
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: >
          cd android && ./gradlew assembleRelease
          -Pandroid.injected.signing.store.file=$GITHUB_WORKSPACE/open-ledger.keystore
          -Pandroid.injected.signing.store.password="$KS_PASS"
          -Pandroid.injected.signing.key.alias="$KEY_ALIAS"
          -Pandroid.injected.signing.key.password="$KEY_PASS"

      - name: Build debug APK (fallback, no signing secrets)
        if: steps.keystore.outputs.missing == '1'
        run: cd android && ./gradlew assembleDebug

      - name: Rename APK
        id: apk
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          SRC=$(find android/app/build/outputs/apk -name '*.apk' | head -1)
          cp "$SRC" "OpenLedger-v${VERSION}.apk"
          echo "path=OpenLedger-v${VERSION}.apk" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: OpenLedger-*.apk

      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: OpenLedger-*.apk
          generate_release_notes: true
